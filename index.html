<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/report-errors.js?v=4"></script>
    <script>
        if (location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
            location.replace('https://' + location.host + location.pathname + location.search + location.hash);
        }
        if (window.self !== window.top) {
            document.documentElement.classList.add('is-embedded');
        }
    </script>
    <title>ChargeNear · Find EV Charging Stations Near You</title>
    <meta name="description" content="Find nearby EV charging stations on a free, interactive map. Filter by network, plug type, and power — and embed it on your hotel or Airbnb site.">
    <link rel="canonical" href="https://chargenear.org/">
    <meta name="theme-color" content="#00355F">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
    <link rel="manifest" href="/site.webmanifest">

    <meta property="og:site_name" content="ChargeNear">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chargenear.org/">
    <meta property="og:title" content="ChargeNear · Find EV Charging Stations Near You">
    <meta property="og:description" content="A free, interactive map of nearby EV chargers. Filter by network, plug type, and power.">
    <meta property="og:image" content="https://chargenear.org/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="ChargeNear — find EV chargers near you">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ChargeNear · Find EV Charging Stations Near You">
    <meta name="twitter:description" content="A free, interactive map of nearby EV chargers. Filter by network, plug type, and power.">
    <meta name="twitter:image" content="https://chargenear.org/og-image.png">
    <meta name="twitter:image:alt" content="ChargeNear — find EV chargers near you">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://api.mapbox.com">
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css?v=4">
    <link rel="stylesheet" href="/css/map.css?v=5">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ChargeNear",
        "url": "https://chargenear.org/",
        "description": "A free, interactive map of nearby EV charging stations, with filters for network, plug type, and power, and an embeddable version for hotels and rental hosts.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Hareesh Gottipati" }
    }
    </script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/"><i class="fa-solid fa-bolt"></i>ChargeNear</a>
        <form class="header-search" id="search-form" role="search">
            <input type="search" id="address" list="address-suggestions" autocomplete="off"
                   placeholder="Search city, address, or zip" aria-label="Search for a location">
            <datalist id="address-suggestions"></datalist>
            <button type="submit" class="btn btn-primary" id="search-button">
                <span class="btn-label">Search</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </form>
        <nav class="header-nav">
            <a href="/about#hosts">For hosts</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <main>
        <div id="map" role="region" aria-label="Map of EV chargers"></div>
        <ul id="filter-chips" class="filter-chips" aria-label="Active filters"></ul>
        <div id="loading" role="status"><span class="spinner"></span> Finding chargers…</div>
        <button type="button" id="search-area" class="search-area-button" hidden>
            <i class="fa-solid fa-rotate-right"></i> Search this area
        </button>
        <div class="map-legend" id="map-legend">
            <button type="button" class="legend-toggle" aria-expanded="false" aria-controls="legend-list">
                <i class="fa-solid fa-circle-info"></i> Legend
            </button>
            <ul class="legend-list" id="legend-list">
                <li><span class="legend-swatch legend-available"></span> Available</li>
                <li><span class="legend-swatch legend-fast"></span> DC fast / 150 kW+</li>
                <li><span class="legend-swatch legend-offline"></span> Offline or unknown</li>
                <li><span class="legend-swatch legend-stale"></span> Not verified in 12+ months</li>
                <li><span class="legend-swatch legend-cluster" aria-hidden="true">3</span> Group (tap to zoom)</li>
                <li><span class="legend-swatch legend-you"></span> You</li>
            </ul>
        </div>
    </main>

    <div id="filter-modal" class="modal">
        <div class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">
            <div class="filter-panel-header">
                <h2 id="filter-title"><i class="fa-solid fa-filter"></i> Filter chargers</h2>
                <button type="button" class="icon-button" id="close-filters" aria-label="Close filters">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="filter-sections">
                <section class="filter-section collapsed">
                    <button type="button" class="section-header" aria-expanded="false">
                        <i class="fa-solid fa-bolt"></i> Charger type
                        <span class="section-count"></span>
                        <i class="fa-solid fa-chevron-down chevron"></i>
                    </button>
                    <div class="section-content">
                        <label class="select-all"><input type="checkbox" id="selectAllChargerTypes"> Select all</label>
                        <label><input type="checkbox" class="charger-type-child" id="fastOnly"> DC fast (Level 3)</label>
                        <label><input type="checkbox" class="charger-type-child" id="level2Only"> Level 2</label>
                    </div>
                </section>

                <section class="filter-section collapsed">
                    <button type="button" class="section-header" aria-expanded="false">
                        <i class="fa-solid fa-network-wired"></i> Network
                        <span class="section-count"></span>
                        <i class="fa-solid fa-chevron-down chevron"></i>
                    </button>
                    <div class="section-content">
                        <label class="select-all"><input type="checkbox" id="selectAllNetwork"> Select all</label>
                        <label><input type="checkbox" class="network-child" id="teslaSupercharger"> Tesla Supercharger</label>
                        <label><input type="checkbox" class="network-child" id="teslaDestination"> Tesla Destination</label>
                        <label><input type="checkbox" class="network-child" id="chargepointOnly"> ChargePoint</label>
                        <label><input type="checkbox" class="network-child" id="electrifyAmerica"> Electrify America</label>
                        <label><input type="checkbox" class="network-child" id="evgo"> EVgo</label>
                        <label><input type="checkbox" class="network-child" id="blink"> Blink</label>
                        <label><input type="checkbox" class="network-child" id="volta"> Volta</label>
                        <label><input type="checkbox" class="network-child" id="shellRecharge"> Shell Recharge</label>
                        <label><input type="checkbox" class="network-child" id="evConnect"> EV Connect</label>
                        <label><input type="checkbox" class="network-child" id="semaConnect"> SemaConnect</label>
                    </div>
                </section>

                <section class="filter-section collapsed">
                    <button type="button" class="section-header" aria-expanded="false">
                        <i class="fa-solid fa-circle-check"></i> Status
                        <span class="section-count"></span>
                        <i class="fa-solid fa-chevron-down chevron"></i>
                    </button>
                    <div class="section-content">
                        <label class="select-all"><input type="checkbox" id="selectAllStatus"> Select all</label>
                        <label><input type="checkbox" class="status-child" id="operationalOnly" checked> Operational only</label>
                        <label><input type="checkbox" class="status-child" id="publicOnly" checked> Public only (hide private &amp; customer-only)</label>
                    </div>
                </section>

                <section class="filter-section collapsed">
                    <button type="button" class="section-header" aria-expanded="false">
                        <i class="fa-solid fa-gauge-high"></i> Power
                        <span class="section-count"></span>
                        <i class="fa-solid fa-chevron-down chevron"></i>
                    </button>
                    <div class="section-content">
                        <label class="select-all"><input type="checkbox" id="selectAllPower"> Select all</label>
                        <label><input type="checkbox" class="power-child" id="highPower"> High (150 kW+)</label>
                        <label><input type="checkbox" class="power-child" id="mediumPower"> Medium (50–150 kW)</label>
                        <label><input type="checkbox" class="power-child" id="lowPower"> Low (under 50 kW)</label>
                    </div>
                </section>

                <section class="filter-section collapsed">
                    <button type="button" class="section-header" aria-expanded="false">
                        <i class="fa-solid fa-person-walking"></i> Walking distance
                        <span class="section-count"></span>
                        <i class="fa-solid fa-chevron-down chevron"></i>
                    </button>
                    <div class="section-content">
                        <label data-short=""><input type="radio" name="nearbyRadius" id="nearbyNone" value="none" checked> Don't show</label>
                        <label data-short="5 min"><input type="radio" name="nearbyRadius" id="nearby5min" value="5min"> 5 min walk (~0.25 mi)</label>
                        <label data-short="15 min"><input type="radio" name="nearbyRadius" id="nearby15min" value="15min"> 15 min walk (~0.75 mi)</label>
                        <label data-short="1 mi"><input type="radio" name="nearbyRadius" id="nearby1mile" value="1mile"> 1 mile</label>
                    </div>
                </section>
            </div>

            <div class="filter-panel-footer">
                <button type="button" id="reset-filters" class="btn btn-secondary">Reset</button>
                <button type="button" id="apply-filters" class="btn btn-navy">Show results</button>
            </div>
        </div>
    </div>

    <script src="/config.js" defer></script>
    <script type="module" src="/js/script.js?v=6"></script>
</body>
</html>
